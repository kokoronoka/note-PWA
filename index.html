    if (!folders.find(f => f.id === newRecord.id)) {
      folders.push(mapCloudFolder(newRecord));
    }
  }

  if (eventType === 'UPDATE') {
    const index = folders.findIndex(f => f.id === newRecord.id);
    if (index !== -1) folders[index] = mapCloudFolder(newRecord);
  }

  if (eventType === 'DELETE') {
    // old carries the deleted row; new is always empty on a DELETE event
    const deletedId = oldRecord?.id;
    if (!deletedId) {
      console.warn('[realtime] DELETE missing old record — check replica identity full is set on folders table');
      return;
    }
    folders = folders.filter(f => f.id !== deletedId);
    if (activeFolderId === deletedId) activeFolderId = null;
    notes.forEach(n => { if (n.folderId === deletedId) n.folderId = null; });
    saveNotesLocal();
  }

  saveFoldersLocal();
  renderFolders();
  renderList();
}

// Applies a remote update to the currently-open note without disturbing
// whatever the user is focused on (title/textarea keep their live value if
// the user is currently in that field).
function reloadActiveNoteContent(note) {
  if (document.activeElement !== document.getElementById('noteTitleInput')) {
    document.getElementById('noteTitleInput').value = note.title || '';
  }

  if (note.type === 'ink' && note.inkData) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Explicit logical destination size: ctx already has scale(DPR,DPR)
      // applied, so drawing at the image's native (DPR-multiplied) pixel
      // size with no destination size would double-scale it.
      ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
      // Without this, undo's stack still points at pre-sync content — the
      // canvas visibly changed but undo would have no matching entry for it.
      saveSnapshot();
    };
    img.src = note.inkData;
  }

  if (note.type === 'type' && document.activeElement !== document.getElementById('noteTextarea')) {
    document.getElementById('noteTextarea').value = note.textData || '';
  }
}

// ── Service Worker ──
function registerSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

// ── Note CRUD ──
function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function createNote() {
  const note = {
    id: generateId(),
    title: '',
    type: 'type',
    inkData: null,
    textData: '',
    zoom: 1,
    panX: 0,
    panY: 0,
    folderId: activeFolderId, // lands in whichever folder is currently open
    created: Date.now(),
    updated: Date.now()
  };
  notes.unshift(note);
  saveNotes();
  // Queue it before the upsert even starts — if the user hits sync while
  // this is still in flight, the note stays visible instead of getting
  // wiped by a cloud fetch that doesn't have it yet (see reconcileWithCloud)
  addToPendingCreates('note', note);
  renderFolders(); // folder-count badge for note.folderId just grew by one
  renderList();
  selectNote(note.id); // selectNote() saves the outgoing note, then clears the textarea before loading this one
  // Focus title
  setTimeout(() => document.getElementById('noteTitleInput').focus(), 50);
  upsertNoteToCloud(note); // removePendingCreate() happens inside on success
}

async function deleteNote(id) {
  // If this note was still an unconfirmed pending create, it was never
  // actually synced to Supabase in the first place — removing the pending
  // create IS the delete. There's nothing server-side to delete, and
  // queuing a pending delete for a row that never existed there would just
  // sit in that queue forever (harmless, but pointless) while also leaving
  // the now-orphaned pending create free to resurrect this note on the next
  // sync's reconcileWithCloud() merge (the actual ghost-note bug this
  // guards against).
  const wasPendingCreate = getPendingCreates().some(p => p.id === id && p.type === 'note');
  removePendingCreate(id);

  // Optimistic: local state and UI update immediately, before the cloud
  // delete even starts — the user should never wait on a network round trip
  // just to see a note disappear from the list.
  notes = notes.filter(n => n.id !== id);
  saveNotes();
  if (activeId === id) {
    activeId = null;
    if (notes.length > 0) selectNote(notes[0].id);
    else showEmpty();
  }
  renderFolders(); // the deleted note's folder-count badge just shrank by one
  renderList();

  if (wasPendingCreate) return;

  // If the cloud delete doesn't confirm, queue it — otherwise the next
  // fetch would resurrect this note as a ghost (see flushPendingDeletes)
  const success = await deleteNoteFromCloud(id);
  if (!success) {
    addToPendingDeletes('note', id);
    setSaveStatus('⚠ delete queued');
    setTimeout(() => setSaveStatus('saved'), 3000);
  }
}

function saveNotes() {
  localStorage.setItem('inkpad_notes', JSON.stringify(notes));
}
// Alias used by the realtime sync code below — same function, not a copy.
const saveNotesLocal = saveNotes;

function saveFoldersLocal() {
  localStorage.setItem('welovenote_folders', JSON.stringify(folders));
}

function getActive() { return notes.find(n => n.id === activeId); }

// ── Save current note state ──
// immediate=true skips the yield-then-encode optimization below and encodes
// synchronously instead — required whenever the canvas is about to be
// cleared/reused right after this call returns (switching notes) or the
// page is about to unload (a deferred setTimeout may never get to run).
function saveActiveNote(immediate = false) {
  const note = getActive();
  if (!note) return;
  note.title = document.getElementById('noteTitleInput').value;
  note.updated = Date.now();
  note.type = mode;
  note.zoom = zoom;
  note.panX = panX;
  note.panY = panY;
  if (mode === 'ink') {
    const encode = () => {
      // JPEG instead of PNG: 3-5x smaller (faster to encode/decode, less
      // localStorage used) — quality 0.85 is visually indistinguishable for
      // handwritten notes. Loading it back works the same way (img.src).
      // JPEG has no alpha channel though, and the canvas is transparent
      // wherever nothing's drawn — flatten onto the paper background first,
      // or every undrawn area would be saved (and reloaded) as solid black.
      const flat = document.createElement('canvas');
      flat.width = canvas.width;
      flat.height = canvas.height;
      const fctx = flat.getContext('2d');
      fctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--canvas-bg').trim() || '#F0EDE6';
      fctx.fillRect(0, 0, flat.width, flat.height);
      fctx.drawImage(canvas, 0, 0);
      note.inkData = flat.toDataURL('image/jpeg', 0.85);
      saveNotes();
      // Background sync — never awaited, so a slow/failed cloud write can
      // never add lag to drawing; a later save just retries it naturally
      upsertNoteToCloud(note).catch(err => console.error('Background sync failed:', err));
    };
    if (immediate) encode();
    else setTimeout(encode, 0); // yield to the browser before the (blocking) encode
  } else {
    note.textData = document.getElementById('noteTextarea').value;
    saveNotes();
    upsertNoteToCloud(note).catch(err => console.error('Background sync failed:', err));
  }
  setSaveStatus('saved');
  renderList();
}

function debounceSave() {
  setSaveStatus('saving…');
  clearTimeout(saveTimer);
  const delay = window.innerWidth <= 768 ? 2000 : 800;
  saveTimer = setTimeout(saveActiveNote, delay);
}

function setSaveStatus(txt) {
  document.getElementById('saveStatus').textContent = txt;
}

// ── Select Note ──
function selectNote(id) {
  isSwitchingNote = true;

  // Save previous
  // immediate=true: the canvas gets cleared/reused for the incoming note a
  // few lines below, so the outgoing note's ink must be captured synchronously
  if (activeId && activeId !== id) saveActiveNote(true);

  activeId = id;
  const note = getActive();
  if (!note) return;

  // On mobile/tablet the sidebar is a drawer over the note — close it once
  // a note is picked so the note is immediately visible (harmless no-op on
  // desktop, where the sidebar is never given the 'open' class)
  closeSidebar();

  // Show toolbar + note surface
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('noteSurface').style.display = 'flex';

  // Set title
  document.getElementById('noteTitleInput').value = note.title;

  // Restore this note's own zoom/pan (defaults to 100% at origin 0,0)
  zoom = note.zoom || 1;
  panX = note.panX || 0;
  panY = note.panY || 0;
  applyTransform();

  // Show the correct layer on top
  setMode(note.type || 'type', false);

  // Always load BOTH layers — every note keeps its ink and its text
  // independently, regardless of which one is currently on top. This also
  // guarantees no previous note's ink or text can bleed into this one.
  undoStack = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('noteTextarea').value = note.textData || '';
  if (note.inkData) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Explicit destination size: ctx already has scale(DPR,DPR) applied,
      // and img's native size is the physical (DPR-multiplied) pixel size,
      // so drawImage(img,0,0) with no destination size would double-scale
      // it — rendering only the top-left quarter of the saved drawing on
      // any DPR>1 device (i.e. virtually every phone).
      ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
      saveSnapshot();
    };
    img.src = note.inkData;
  }

  setSaveStatus('saved');
  renderList();

  // Every newly opened/created note starts in hand (pan) mode — drawing is
  // an explicit choice, never the default a user lands in.
  setActiveTool('hand');

  // Held a little past the synchronous work above since the ink image load
  // (if any) finishes asynchronously — give it room to land before realtime
  // updates for this note are allowed through again.
  setTimeout(() => { isSwitchingNote = false; }, 500);
}

// ── Mode Switch ──
// Switching modes only changes which layer is on top/interactive — both
// layers stay mounted and their data is never cleared or discarded here.
function setMode(m, save = true) {
  if (save && activeId) saveActiveNote();
  mode = m;

  document.getElementById('modeInk').classList.toggle('active', m === 'ink');
  document.getElementById('modeType').classList.toggle('active', m === 'type');
  document.getElementById('inkTools').style.display = m === 'ink' ? 'flex' : 'none';
  document.getElementById('btnExportTXT').style.display = m === 'type' ? 'flex' : 'none';
  document.getElementById('zoomControls').style.display = m === 'ink' ? 'flex' : 'none';

  // Active layer on top and interactive; the other stays visible underneath
  // as a faded, read-only underlay
  const canvasWrap = document.getElementById('canvasWrap');
  const typeWrap = document.getElementById('typeWrap');
  canvasWrap.classList.toggle('layer-active', m === 'ink');
  canvasWrap.classList.toggle('layer-inactive', m !== 'ink');
  typeWrap.classList.toggle('layer-active', m === 'type');
  typeWrap.classList.toggle('layer-inactive', m !== 'type');
  if (m === 'ink') document.getElementById('noteTextarea').blur();
  if (m === 'type') setTimeout(() => document.getElementById('noteTextarea').focus(), 50);

  const note = getActive();
  if (note) note.type = m;
}

// ── Canvas ──
// Logical page size depends on the viewport at load time: full 3000x2000 on
// desktop, smaller on mobile/tablet so the backing store (size x DPR) stays
// within what mobile GPUs can push around comfortably.
function getCanvasDims() {
  const w = window.innerWidth;
  if (w <= 480) return { w: 1500, h: 1000 };
  if (w <= 768) return { w: 2000, h: 1400 };
  return { w: 3000, h: 2000 };
}

// The canvas is a fixed-size logical page (CANVAS_W x CANVAS_H), sized once.
// Zoom/pan never touch these dimensions — they only move the CSS transform.
function initCanvasSize() {
  const dims = getCanvasDims();
  CANVAS_W = dims.w;
  CANVAS_H = dims.h;
  DPR = Math.min(window.devicePixelRatio || 1, 2); // cap regardless of actual screen density

  [canvas, bufferCanvas].forEach(c => {
    c.style.width = CANVAS_W + 'px';
    c.style.height = CANVAS_H + 'px';
    c.width = CANVAS_W * DPR;
    c.height = CANVAS_H * DPR;
  });
  [ctx, bufferCtx].forEach(c => {
    c.scale(DPR, DPR);
    c.lineCap = 'round';
    c.lineJoin = 'round';
  });

  // Undo snapshots are captured at 1x (logical) resolution rather than the
  // full DPR-scaled backing store. Raw ImageData at, say, 6000x4000 (desktop
  // at DPR 2) is 96MB PER SNAPSHOT — 20 of those is ~1.9GB, which is more
  // memory than the old toDataURL() approach ever used (500KB-2MB each),
  // not less. Downscaling to logical size keeps snapshots fast to capture
  // (still no PNG encode/decode) while keeping total memory sane.
  undoCanvas.width = CANVAS_W;
  undoCanvas.height = CANVAS_H;
}

// Mobile/tablet keep fewer, smaller undo steps than desktop (see comment
// in initCanvasSize about why full-resolution ImageData isn't used here).
function undoLimit() {
  return window.innerWidth <= 768 ? 10 : 20;
}

function saveSnapshot() {
  undoCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  undoCtx.drawImage(canvas, 0, 0, CANVAS_W, CANVAS_H); // downscale from the DPR-scaled main canvas
  undoStack.push(undoCtx.getImageData(0, 0, CANVAS_W, CANVAS_H));
  if (undoStack.length > undoLimit()) undoStack.shift();
}

// Paints a saved undo snapshot back onto the main canvas, upscaling from
// the logical-resolution snapshot to the canvas's full DPR-scaled size.
function restoreSnapshot(imageData) {
  undoCtx.putImageData(imageData, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(undoCanvas, 0, 0, CANVAS_W, CANVAS_H);
}

// ── Zoom & pan ──
// screenX/Y here are relative to #canvasWrap's own (untransformed) box —
// the stable reference frame the zoom/pan transform is measured against.
function wrapPoint(e) {
  const rect = document.getElementById('canvasWrap').getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

// Inverse of the transform below: canvasX = (screenX - panX) / zoom
function canvasPointFromScreen(sx, sy) {
  return { x: (sx - panX) / zoom, y: (sy - panY) / zoom };
}

// Keep at least 200px of the canvas visible in the viewport on each axis,
// so panning can never push the whole page off screen.
const MIN_VISIBLE = 200;
function clampPan() {
  const wrap = document.getElementById('canvasWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const visW = CANVAS_W * zoom, visH = CANVAS_H * zoom;
  const minX = Math.min(MIN_VISIBLE - visW, w - MIN_VISIBLE);
  const maxX = Math.max(MIN_VISIBLE - visW, w - MIN_VISIBLE);
  panX = Math.min(maxX, Math.max(minX, panX));
  const minY = Math.min(MIN_VISIBLE - visH, h - MIN_VISIBLE);
  const maxY = Math.max(MIN_VISIBLE - visH, h - MIN_VISIBLE);
  panY = Math.min(maxY, Math.max(minY, panY));
}

function applyTransform() {
  clampPan();
  document.getElementById('canvasTransformWrap').style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
}

// Change zoom while keeping the canvas point under (anchorX, anchorY) fixed
// on screen — i.e. zoom "toward" that point rather than toward the origin.
function setZoom(newZoom, anchorX, anchorY) {
  newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
  const pt = canvasPointFromScreen(anchorX, anchorY);
  panX = anchorX - pt.x * newZoom;
  panY = anchorY - pt.y * newZoom;
  zoom = newZoom;
  applyTransform();
}

function zoomByButton(factor) {
  const rect = document.getElementById('canvasWrap').getBoundingClientRect();
  setZoom(zoom * factor, rect.width / 2, rect.height / 2);
  debounceSave();
}

function resetZoom() {
  zoom = 1;
  panX = 0;
  panY = 0;
  applyTransform();
  debounceSave();
}

function pinchDistance(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }
function pinchMidpoint(p1, p2) { return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }

// Recomputed every frame from the CURRENT (not gesture-start) scale/pan, so
// the canvas point under the finger midpoint stays fixed on screen through
// the whole gesture — pinch-zoom and two-finger drag both fall out of this
// same formula (a pure drag is just a "pinch" with an unchanged distance).
// canvasMid must be taken from the PREVIOUS frame's midpoint (not this
// frame's) — using the current midpoint here would make the pan update a
// no-op whenever distance is unchanged, since it'd just be re-deriving
// "wherever the fingers already are" from itself.
function updatePinch() {
  const pts = [...activeTouches.values()];
  if (pts.length < 2 || !pinch) return;
  const [p1, p2] = pts;
  const dist = pinchDistance(p1, p2);
  const mid = pinchMidpoint(p1, p2);

  // Canvas point that was under the fingers' PREVIOUS midpoint, using
  // scale/pan as they stood before this frame's update
  const canvasMid = canvasPointFromScreen(pinch.prevMid.x, pinch.prevMid.y);

  const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * (dist / pinch.prevDist)));

  // Re-anchor so that same canvas point ends up under the CURRENT midpoint
  panX = mid.x - canvasMid.x * newZoom;
  panY = mid.y - canvasMid.y * newZoom;
  zoom = newZoom;
  pinch.prevDist = dist;
  pinch.prevMid = mid;

  applyTransform();
}

function getPos(e) {
  const p = wrapPoint(e);
  const c = canvasPointFromScreen(p.x, p.y);
  return { x: c.x, y: c.y, pressure: e.pressure !== undefined && e.pressure > 0 ? e.pressure : 0.5 };
}

// The active stroke is drawn on bufferCanvas, not the main canvas — this
// avoids reading from and writing to the same (GPU-composited, will-change)
// canvas simultaneously, which stalls the render pipeline on mobile GPUs.
function startDraw(e) {
  e.preventDefault();
  const pos = getPos(e);
  drawing = true;
  lastX = pos.x;
  lastY = pos.y;

  bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
  bufferCtx.drawImage(canvas, 0, 0, CANVAS_W, CANVAS_H); // seed with the committed content
  bufferCanvas.style.display = 'block';

  bufferCtx.beginPath();
  bufferCtx.moveTo(lastX, lastY);
  saveSnapshot(); // captures the main canvas's pre-stroke state, untouched by the above
}

function draw(e) {
  if (!drawing) return;
  const pos = getPos(e);
  const pressure = pos.pressure > 0 ? pos.pressure : 0.5;
  const erasing = activeTool === 'eraser';
  const dynamicWidth = erasing ? 20 : strokeWidth * (0.5 + pressure * 1.2);

  bufferCtx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  bufferCtx.strokeStyle = erasing ? 'rgba(0,0,0,1)' : currentColor;
  bufferCtx.lineWidth = dynamicWidth;

  bufferCtx.lineTo(pos.x, pos.y);
  bufferCtx.stroke();
  bufferCtx.beginPath();
  bufferCtx.moveTo(pos.x, pos.y);

  lastX = pos.x;
  lastY = pos.y;
  debounceSave();
}

function endDraw(e) {
  if (!drawing) return;
  drawing = false;
  bufferCtx.globalCompositeOperation = 'source-over';

  // Commit the finished stroke onto the main canvas. Must clear first: under
  // source-over, a fully-transparent source pixel leaves the destination
  // pixel completely untouched — so an eraser hole punched into the buffer
  // would silently vanish on commit, leaving the old (un-erased) pixel on
  // the main canvas in place, if the stale content underneath weren't wiped
  // out before drawing the buffer's actual final state on top of it.
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bufferCanvas, 0, 0, CANVAS_W, CANVAS_H);
  bufferCanvas.style.display = 'none';
}

// Hand-tool single-pointer pan (one finger, or mouse-drag while hand tool is
// active). Mirrors middleDrag below, kept separate so a 2nd touch or a
// stylus can cancel/ignore it without touching middleDrag's own state.
function startPan(e) {
  handPan = { startX: e.clientX, startY: e.clientY, startPanX: panX, startPanY: panY };
  canvas.style.cursor = 'grabbing';
}

function updatePan(e) {
  if (!handPan) return;
  panX = handPan.startPanX + (e.clientX - handPan.startX);
  panY = handPan.startPanY + (e.clientY - handPan.startY);
  applyTransform(); // clamps panX/panY internally (see clampPan)
}

function endPan() {
  handPan = null;
  applyToolCursor();
}

// Restores the cursor for whichever tool is currently active — used after
// any transient cursor override (middle-drag pan, space-drag pan, hand pan)
// ends, instead of blindly clearing to '' which would wipe out the eraser's
// custom cursor image set by updateEraserCursor().
function applyToolCursor() {
  if (activeTool === 'eraser') updateEraserCursor();
  else if (activeTool === 'hand') canvas.style.cursor = 'grab';
  else canvas.style.cursor = '';
}

// Pointer events handle all three input kinds. Touch is tracked separately
// (activeTouches) so a 2nd finger starts a pinch/pan instead of a 2nd stroke;
// mouse/pen always draw, except a middle-mouse-button drag, which pans.
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    activeTouches.set(e.pointerId, wrapPoint(e));
    if (activeTouches.size === 1) {
      e.preventDefault();
      if (activeTool === 'hand') startPan(e);
      else startDraw(e);
    } else if (activeTouches.size === 2) {
      endDraw(e); // a 2nd finger cancels any in-progress single-finger stroke
      endPan();   // ...or an in-progress single-finger hand-tool pan
      const [p1, p2] = [...activeTouches.values()];
      pinch = { prevDist: pinchDistance(p1, p2), prevMid: pinchMidpoint(p1, p2) };
    }
    return;
  }

  // Middle-mouse-button drag, or Space held + left-click drag, both pan
  // regardless of the active tool
  if (e.pointerType === 'mouse' && (e.button === 1 || (e.button === 0 && spaceHeld))) {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    middleDrag = { startX: e.clientX, startY: e.clientY, startPanX: panX, startPanY: panY };
    canvas.style.cursor = 'grabbing';
    return;
  }

  // Stylus always draws/erases, regardless of the active tool — a finger
  // navigates, a stylus writes, matching every professional note app
  if (e.pointerType === 'pen') {
    startDraw(e);
    return;
  }

  // Mouse (left-click): behaviour follows the active tool
  if (activeTool === 'hand') startPan(e);
  else startDraw(e);
}, { passive: false });

// Batches fast-firing pointermove events into at most one canvas/transform
// update per animation frame, instead of one per event (which fires faster
// than the screen refreshes). preventDefault() must stay in the synchronous
// listener below — it has no effect once called from this deferred callback.
function processPointerMove() {
  rafPending = false;
  rafHandle = null;
  const e = lastMoveEvent;
  lastMoveEvent = null;
  if (!e) return;

  if (e.pointerType === 'touch') {
    if (activeTouches.size >= 2 && pinch) {
      updatePinch();
      debounceSave();
    } else if (activeTouches.size === 1 && handPan) {
      updatePan(e);
      debounceSave();
    } else if (activeTouches.size === 1 && drawing) {
      // Replay every point sampled since the last frame (if the browser
      // coalesced several into this one event) for a fully-sampled line,
      // while still only touching the canvas once per rendered frame
      const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      (events.length ? events : [e]).forEach(draw);
    }
    return;
  }

  if (middleDrag) {
    panX = middleDrag.startPanX + (e.clientX - middleDrag.startX);
    panY = middleDrag.startPanY + (e.clientY - middleDrag.startY);
    applyTransform();
    debounceSave();
    return;
  }

  if (handPan) {
    updatePan(e);
    debounceSave();
    return;
  }

  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  (events.length ? events : [e]).forEach(draw);
}

function scheduleMove(e) {
  lastMoveEvent = e;
  if (!rafPending) {
    rafPending = true;
    rafHandle = requestAnimationFrame(processPointerMove);
  }
}

// Applies any move batched for the next frame right now — called before a
// gesture ends, so the final segment before pointerup is never dropped.
function flushPendingMove() {
  if (rafPending) {
    cancelAnimationFrame(rafHandle);
    processPointerMove();
  }
}

canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && activeTouches.has(e.pointerId)) {
    activeTouches.set(e.pointerId, wrapPoint(e));
    if ((activeTouches.size >= 2 && pinch) || (activeTouches.size === 1 && (drawing || handPan))) {
      e.preventDefault();
    }
    scheduleMove(e);
    return;
  }

  if (middleDrag || handPan || drawing) e.preventDefault();
  scheduleMove(e);
}, { passive: false });

function releasePointer(e) {
  flushPendingMove();
  if (e.pointerType === 'touch') {
    activeTouches.delete(e.pointerId);
    if (activeTouches.size < 2) pinch = null;
    if (activeTouches.size === 0) { endDraw(e); endPan(); }
    return;
  }
  // Checked by state, not button number, so a Space+left-click pan (button
  // 0) still ends correctly here, not just an actual middle-click (button 1)
  if (middleDrag) {
    middleDrag = null;
    if (spaceHeld) canvas.style.cursor = 'grab';
    else applyToolCursor();
    return;
  }
  if (handPan) {
    endPan();
    return;
  }
  endDraw(e);
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointerout', releasePointer);

// Ctrl + scroll wheel to zoom, anchored at the cursor position
document.getElementById('canvasWrap').addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const p = wrapPoint(e);
  setZoom(zoom * Math.exp(-e.deltaY * 0.0015), p.x, p.y);
  debounceSave();
}, { passive: false });

// Zoom control buttons
document.getElementById('zoomInBtn').addEventListener('click', () => zoomByButton(1.25));
document.getElementById('zoomOutBtn').addEventListener('click', () => zoomByButton(1 / 1.25));
document.getElementById('zoomResetBtn').addEventListener('click', resetZoom);

// Space + left-click drag to pan (bonus, common in design tools). Ignored
// while typing in the title/textarea so a literal space still works there.
let spaceHeld = false;
function isTypingTarget(el) {
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
}
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spaceHeld && !isTypingTarget(e.target)) {
    spaceHeld = true;
    canvas.style.cursor = 'grab';
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceHeld = false;
    if (!middleDrag) applyToolCursor();
  }
});
window.addEventListener('blur', () => {
  spaceHeld = false;
  if (!middleDrag) applyToolCursor();
});

document.getElementById('noteTitleInput').addEventListener('input', debounceSave);

  userIsTyping = true;

  typingTimer = setTimeout(() => { userIsTyping = false; }, 2000);

// Shows a circular outline at the eraser's actual size while it's active,
// in place of the generic 'cell' cursor. Sized off the same fixed 20px
// width draw() actually uses for the eraser (see dynamicWidth) — the
// stroke-size slider only ever affects the pen, not the eraser, so this
// deliberately does not track it.
function updateEraserCursor() {
  if (activeTool !== 'eraser') {
    canvas.style.cursor = '';
    return;
  }
  const ERASER_WIDTH = 20;
  const size = Math.max(ERASER_WIDTH, 8);
  const cursorCanvas = document.createElement('canvas');
  cursorCanvas.width = size + 4;
  cursorCanvas.height = size + 4;
  const c = cursorCanvas.getContext('2d');
  c.beginPath();
  c.arc(size / 2 + 2, size / 2 + 2, size / 2, 0, Math.PI * 2);
  c.strokeStyle = '#555';
  c.lineWidth = 1.5;
  c.stroke();
  const url = cursorCanvas.toDataURL();
  canvas.style.cursor = `url(${url}) ${size / 2 + 2} ${size / 2 + 2}, cell`;
}

// Only one of hand/pen/eraser is ever active at a time — this is the single
// place that switches between them, keeping the activeTool var, the toolbar
// button states, and the canvas cursor/class all in sync.
function setActiveTool(tool) {
  activeTool = tool;
  document.getElementById('toolHand').classList.toggle('active', tool === 'hand');
  document.getElementById('toolPen').classList.toggle('active', tool === 'pen');
  document.getElementById('toolEraser').classList.toggle('active', tool === 'eraser');
  canvas.classList.toggle('eraser-mode', tool === 'eraser');
  canvas.classList.toggle('hand-mode', tool === 'hand');
  applyToolCursor();
}

document.getElementById('toolHand').addEventListener('click', () => setActiveTool('hand'));
document.getElementById('toolPen').addEventListener('click', () => setActiveTool('pen'));
document.getElementById('toolEraser').addEventListener('click', () => setActiveTool('eraser'));

document.getElementById('strokeSize').addEventListener('input', e => {
  strokeWidth = parseInt(e.target.value);
});

document.getElementById('toolClear').addEventListener('click', () => {
  if (!confirm('Clear this canvas?')) return;
  saveSnapshot();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  debounceSave();
});

document.getElementById('toolUndo').addEventListener('click', () => {
  // saveSnapshot() pushes the pre-stroke state at the start of every stroke,
  // so the top of the stack IS the correct "undo the last stroke" target —
  // restore it, then discard it so the next undo goes one step further back.
  if (!undoStack.length) return;
  restoreSnapshot(undoStack[undoStack.length - 1]);
  undoStack.pop();
  debounceSave();
});

document.querySelectorAll('.color-swatch').forEach(sw => {

    currentColor = sw.dataset.color;
    setActiveTool('pen');
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    document.getElementById('colorCustom').value = currentColor;

});

document.getElementById('colorCustom').addEventListener('input', e => {

// ── Folders ──

// Escapes user-entered text (folder names are freely typed via
// contentEditable) before it's interpolated into innerHTML template strings.
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

const FOLDER_ICON_CLOSED = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
const FOLDER_ICON_OPEN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><polyline points="2 10 12 10 22 10"/></svg>`;
const FOLDER_ICON_NEW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="10" y1="15" x2="14" y2="15"/></svg>`;

function renderFolders() {
  const list = document.getElementById('foldersList');
  const allActive = activeFolderId === null;

  const allNotesRow = `
    <div class="folder-item${allActive ? ' active' : ''}" id="folderAll" onclick="selectFolder(null)">
      ${allActive ? FOLDER_ICON_OPEN : FOLDER_ICON_CLOSED}
      <span>All Notes</span>
      <span class="folder-count">${notes.length}</span>
    </div>`;

  const folderRows = folders.map(f => {
    const isActive = activeFolderId === f.id;
    const count = notes.filter(n => n.folderId === f.id).length;
    return `
    <div class="folder-item${isActive ? ' active' : ''}" data-folder-id="${f.id}" onclick="selectFolder('${f.id}')">
      ${isActive ? FOLDER_ICON_OPEN : FOLDER_ICON_CLOSED}
      <span class="folder-name" onclick="if (this.isContentEditable) event.stopPropagation()">${escapeHtml(f.name)}</span>
      <span class="folder-count">${count}</span>
      <div class="folder-actions">
        <button onclick="renameFolder('${f.id}', event)" title="Rename">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
          </svg>
        </button>
        <button class="folder-delete-btn" onclick="deleteFolder('${f.id}', event)" title="Delete">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14H6L5 6"/>
          </svg>
        </button>
      </div>
    </div>`;
  }).join('');

  const newFolderBtn = `
    <button class="btn-new-folder" onclick="createFolder()">
      ${FOLDER_ICON_NEW}
      <span>New Folder</span>
    </button>`;

  list.innerHTML = allNotesRow + folderRows + newFolderBtn;
}

function createFolder() {
  const folder = {
    id: generateId(),
    name: 'Untitled Folder',
    created: Date.now(),
    updated: Date.now()
  };
  folders.push(folder);
  saveFoldersLocal();
  renderFolders();
  // Same reasoning as createNote() — queue before the upsert starts, so a
  // sync mid-flight can't wipe this folder before it's confirmed
  addToPendingCreates('folder', folder);
  upsertFolderToCloud(folder); // removePendingCreate() happens inside on success
  startRenameFolder(folder.id);
}

// Wrapper for the rename button's onclick — keeps the click from also
// bubbling into the row's own onclick (which would switch folders)
function renameFolder(id, e) {
  e.stopPropagation();
  startRenameFolder(id);
}

function startRenameFolder(id) {
  const item = document.querySelector(`.folder-item[data-folder-id="${id}"] .folder-name`);
  if (!item) return;
  const current = item.textContent;
  item.contentEditable = 'true';
  item.focus();

  const range = document.createRange();
  range.selectNodeContents(item);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);

  function save() {
    item.contentEditable = 'false';
    const newName = item.textContent.trim() || 'Untitled Folder';
    const folder = folders.find(f => f.id === id);
    if (folder) {
      folder.name = newName;
      folder.updated = Date.now();
      saveFoldersLocal();
      upsertFolderToCloud(folder).catch(err => console.error('Folder sync failed:', err));
      renderFolders();
    }
  }
  item.addEventListener('blur', save, { once: true });
  item.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); item.blur(); }
    if (e.key === 'Escape') { item.textContent = current; item.blur(); }
  });
}

async function deleteFolder(id, e) {
  e.stopPropagation();
  const folder = folders.find(f => f.id === id);
  if (!folder) return;
  const noteCount = notes.filter(n => n.folderId === id).length;
  const msg = noteCount > 0
    ? `Delete "${folder.name}"? The ${noteCount} note${noteCount !== 1 ? 's' : ''} inside will be moved to All Notes.`
    : `Delete "${folder.name}"?`;
  if (!confirm(msg)) return;

  // Same reasoning as deleteNote() — an unconfirmed pending create was
  // never actually synced, so removing it from the queue IS the delete;
  // there's nothing server-side to delete and no reason to leave the
  // now-orphaned create free to resurrect this folder on the next sync.
  const wasPendingCreate = getPendingCreates().some(p => p.id === id && p.type === 'folder');
  removePendingCreate(id);

  notes.forEach(n => {
    if (n.folderId === id) {
      n.folderId = null;
      upsertNoteToCloud(n).catch(err => console.error('Background sync failed:', err));
    }
  });
  saveNotes();

  folders = folders.filter(f => f.id !== id);
  saveFoldersLocal();

  if (activeFolderId === id) selectFolder(null); // also re-renders folders + list
  else renderFolders();

  if (wasPendingCreate) return;

  // Same optimistic-then-confirm pattern as deleteNote — queue it if the
  // cloud delete doesn't confirm, so it doesn't come back as a ghost folder
  const success = await deleteFolderFromCloud(id);
  if (!success) addToPendingDeletes('folder', id);
}

function selectFolder(folderId) {
  activeFolderId = folderId;
  renderFolders();
  renderList();
}

function moveNoteToFolder(noteId, folderId) {
  const note = notes.find(n => n.id === noteId);
  if (!note) return;
  note.folderId = folderId;
  note.updated = Date.now();
  saveNotes();
  upsertNoteToCloud(note).catch(err => console.error('Background sync failed:', err));
  renderFolders();
  renderList();
}

// ── Note options menu (three-dots button: Add to Folder / Rename / Delete) ──
let activeMenuNoteId = null;

function openNoteMenu(noteId, e) {
  e.stopPropagation();
  activeMenuNoteId = noteId;
  const menu = document.getElementById('noteContextMenu');
  const mainView = document.getElementById('mainMenuView');
  const folderView = document.getElementById('folderPickerView');

  // Always show the main view first, even if a previous open left it on the folder picker
  mainView.style.display = 'block';
  folderView.style.display = 'none';

  // Position near the three-dots button, clamped to the viewport
  const btnRect = e.currentTarget.getBoundingClientRect();
  const menuWidth = 188;
  const menuHeight = 160;

  let top = btnRect.bottom + 4;
  let left = btnRect.right - menuWidth;

  if (left < 8) left = 8;
  if (top + menuHeight > window.innerHeight - 8) top = btnRect.top - menuHeight - 4;

  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  menu.classList.add('open');
}

// ── Render list ──
function renderList() {
  const list = document.getElementById('notesList');
  const filtered = notes.filter(n => {
    const folderMatch = activeFolderId === null ? true : n.folderId === activeFolderId;
    const searchMatch = !searchQuery ||
      (n.title || '').toLowerCase().includes(searchQuery) ||
      (n.textData || '').toLowerCase().includes(searchQuery);
    return folderMatch && searchMatch;
  });

  list.innerHTML = filtered.map(n => {
    // Both layers can hold content independently now — badge reflects
    // what's actually there, not just which mode happens to be active
    const hasInk = !!n.inkData;
    const hasText = !!n.textData;
    const badgeLabel = hasInk && hasText ? 'ink+text' : (hasText ? 'text' : 'ink');
    return `
    <div class="note-item${n.id === activeId ? ' active' : ''}" data-note-id="${n.id}">
      <div class="note-item-body" onclick="selectNote('${n.id}')">
        <div class="note-item-title">${n.title || 'Untitled'}</div>
        <div class="note-item-meta">
          <span class="note-type-badge${hasInk ? ' ink' : ''}">${badgeLabel}</span>
          ${formatDate(n.updated)}
        </div>
      </div>
      <button class="note-menu-btn" onclick="openNoteMenu('${n.id}', event)" title="Note options">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15">
          <circle cx="12" cy="5" r="1"/>
          <circle cx="12" cy="12" r="1"/>
          <circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>
  `;
  }).join('');

  document.getElementById('noteCount').textContent =
    `${notes.length} note${notes.length !== 1 ? 's' : ''}`;
}

function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function showEmpty() {
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('noteSurface').style.display = 'none';
  document.getElementById('emptyState').style.display = 'flex';
}

// ── Export ──

// Strip characters that aren't safe in a downloaded filename
function sanitizeFilename(name) {
  return name.replace(/[\\/:*?"<>|]/g, '-');
}

// Trigger a browser download for a Blob via a temporary <a download>
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Briefly show "Exported!" on the save-status span, then restore it
function flashExported() {
  setSaveStatus('Exported!');
  setTimeout(() => setSaveStatus('saved'), 1500);
}

// Flatten both layers into a single canvas: the ink drawing with the typed
// text laid on top of it, matching how they're stacked on screen. Used for
// PNG export so a note's whole content (not just the active layer) is kept.
function flattenLayers() {
  const flat = document.createElement('canvas');
  flat.width = canvas.width;
  flat.height = canvas.height;
  const fctx = flat.getContext('2d');

  const vars = getComputedStyle(document.documentElement);
  const bg = vars.getPropertyValue('--canvas-bg').trim() || '#F0EDE6';
  const ink = vars.getPropertyValue('--ink').trim() || '#1A1A1A';

  // Paper background, then the ink drawing on top of it
  fctx.fillStyle = bg;
  fctx.fillRect(0, 0, flat.width, flat.height);
  fctx.drawImage(canvas, 0, 0);

  // The typed text, laid out the same way it appears in .note-textarea
  const text = document.getElementById('noteTextarea').value;
  if (text) {
    // Use the same (possibly capped) DPR the canvas itself was scaled with —
    // not the raw device value, which may be higher than what was applied
    const fontSize = 15;
    const lineHeight = fontSize * 1.8; // matches .note-textarea line-height: 1.8
    const padX = 48, padY = 40;         // matches .note-textarea padding: 40px 48px
    const contentWidth = flat.width / DPR - padX * 2;
    const font = `${fontSize}px 'JetBrains Mono', monospace`;

    fctx.save();
    fctx.scale(DPR, DPR);
    fctx.font = font;
    fctx.fillStyle = ink;
    fctx.textBaseline = 'top';

    // Word-wrap using the same measuring context we're about to draw with
    const lines = [];
    text.split('\n').forEach(rawLine => {
      if (rawLine === '') { lines.push(''); return; }
      let current = '';
      rawLine.split(' ').forEach(word => {
        const test = current ? current + ' ' + word : word;
        if (current && fctx.measureText(test).width > contentWidth) {
          lines.push(current);
          current = word;
        } else {
          current = test;
        }
      });
      lines.push(current);
    });
    lines.forEach((line, i) => fctx.fillText(line, padX, padY + i * lineHeight));
    fctx.restore();
  }

  return flat;
}

function exportPNG() {
  const note = getActive();
  if (!note) return;
  const titleVal = document.getElementById('noteTitleInput').value.trim();
  const filename = sanitizeFilename(titleVal || 'untitled') + '.png';

  flattenLayers().toBlob(blob => {
    if (blob) { downloadBlob(blob, filename); flashExported(); }
  }, 'image/png');
}

// Builds a real downloadable PDF via jsPDF (loaded from CDN in <head>).
// A4 page size in points: 595 x 842.
function exportPDF() {
  const note = getActive();
  if (!note) return;
  const titleVal = document.getElementById('noteTitleInput').value.trim();
  const filename = sanitizeFilename(titleVal || 'untitled') + '.pdf';

  const { jsPDF } = window.jspdf;
  const pageWidth = 595, pageHeight = 842;
  const margin = 40;
  const doc = new jsPDF({ unit: 'pt', format: [pageWidth, pageHeight] });

  // Title header
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.text(titleVal || 'Untitled', margin, margin);
  const contentTop = margin + 20; // below the header

  if (mode === 'ink') {
    // Ink note: drop the canvas in as a JPEG, scaled to fit the page.
    // The canvas itself is transparent where nothing is drawn, and JPEG has
    // no alpha channel, so flatten onto a white background first — otherwise
    // those areas turn solid black in the exported JPEG.
    const flat = document.createElement('canvas');
    flat.width = canvas.width;
    flat.height = canvas.height;
    const fctx = flat.getContext('2d');
    fctx.fillStyle = '#ffffff';
    fctx.fillRect(0, 0, flat.width, flat.height);
    fctx.drawImage(canvas, 0, 0);
    const imgData = flat.toDataURL('image/jpeg', 0.95);
    const maxWidth = pageWidth - margin * 2;
    const maxHeight = pageHeight - contentTop - margin;
    const ratio = Math.min(maxWidth / canvas.width, maxHeight / canvas.height);
    const imgW = canvas.width * ratio;
    const imgH = canvas.height * ratio;
    doc.addImage(imgData, 'JPEG', margin, contentTop, imgW, imgH);
  } else {
    // Type note: monospace body text, wrapped to the page width, paginated
    const text = document.getElementById('noteTextarea').value;
    doc.setFont('courier', 'normal');
    doc.setFontSize(11);
    const lineHeight = 14;
    const maxWidth = pageWidth - margin * 2;
    const lines = doc.splitTextToSize(text, maxWidth);

    let y = contentTop + lineHeight;
    lines.forEach(line => {
      if (y > pageHeight - margin) {
        doc.addPage([pageWidth, pageHeight]);
        y = margin + lineHeight;
      }
      doc.text(line, margin, y);
      y += lineHeight;
    });
  }

  doc.save(filename);
  flashExported();
}

// Type notes only: download the raw textarea content as a .txt file
function exportTXT() {
  const note = getActive();
  if (!note) return;
  const titleVal = document.getElementById('noteTitleInput').value.trim();
  const filename = sanitizeFilename(titleVal || 'untitled') + '.txt';

  const text = document.getElementById('noteTextarea').value;
  const blob = new Blob([text], { type: 'text/plain' });
  downloadBlob(blob, filename);
  flashExported();
}

// ── Keyboard shortcut ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); createNote(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && mode === 'ink') {
    e.preventDefault();
    document.getElementById('toolUndo').click();
  }
  // Single-key tool shortcuts — only outside of text inputs, and only
  // while a note is open in ink mode
  if (!isTypingTarget(e.target) && !e.ctrlKey && !e.metaKey && !e.altKey && mode === 'ink' && activeId) {
    if (e.key === 'h' || e.key === 'H') setActiveTool('hand');
    else if (e.key === 'p' || e.key === 'P') setActiveTool('pen');
    else if (e.key === 'e' || e.key === 'E') setActiveTool('eraser');

});

// ── Auth ──
// Gates the app behind Supabase sign-in. Notes themselves stay entirely in
// localStorage for now (no sync) — this only controls whether the app UI
// is shown at all.
let appInitialized = false;

function showAuthScreen() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}

function hideAuthScreen() {
  document.getElementById('authScreen').style.display = 'none';
}

// Hides the auth screen, then — the first time only — shows the loading
// overlay while initApp() fetches this user's cloud notes, and reveals the
// app once that's done. A second SIGNED_IN for an already-booted session
// (e.g. a duplicate event) just re-shows the app without re-fetching.
async function bootApp() {
  hideAuthScreen();
  if (currentUser) {
    // Google users carry their display name in user_metadata; email/password
    // users just have .email — email wins when both happen to be present.
    document.getElementById('userEmail').textContent =
      currentUser.email || currentUser.user_metadata?.full_name || 'Signed in';
  }
  document.getElementById('btnRefresh').style.display = currentUser ? 'flex' : 'none';
  if (!appInitialized) {
    appInitialized = true;
    await initApp();
  }
  document.getElementById('app').style.display = 'flex';
}

function setAuthError(msg) {
  document.getElementById('authError').textContent = msg || '';
}
function setAuthMessage(msg) {
  document.getElementById('authMessage').textContent = msg || '';
}

// Translates known Supabase error messages into friendlier copy; anything
// unrecognized is shown as-is rather than swallowed.
function mapAuthError(error) {
  if (!error) return '';
  const msg = error.message || String(error);
  if (msg.includes('Invalid login credentials')) return 'Wrong email or password';
  if (msg.includes('User already registered')) return 'Account already exists, please sign in';
  if (msg.includes('Unable to validate email address')) return 'Please enter a valid email';
  return msg; // e.g. "Password should be at least 6 characters" — shown as-is
}

// Disables both auth buttons and swaps the active one's label while a
// request is in flight, so a slow (1-3s) real network call can't be
// double-tapped and it's clear something is happening.
function setAuthLoading(loading, which) {
  const signInBtn = document.getElementById('btnSignIn');
  const signUpBtn = document.getElementById('btnSignUp');
  signInBtn.disabled = loading;
  signUpBtn.disabled = loading;
  signInBtn.textContent = loading && which === 'signin' ? 'Signing in…' : 'Sign in';
  signUpBtn.textContent = loading && which === 'signup' ? 'Creating account…' : 'Sign up';
}

async function handleSignIn() {
  setAuthError('');
  setAuthMessage('');
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { setAuthError('Enter your email and password.'); return; }

  setAuthLoading(true, 'signin');
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { setAuthError(mapAuthError(error)); return; }
    // onAuthStateChange below fires SIGNED_IN and boots the app from there
  } catch (err) {
    setAuthError('Connection failed — check your internet connection and try again');
  } finally {
    setAuthLoading(false);
  }
}

async function handleSignUp() {
  setAuthError('');
  setAuthMessage('');
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { setAuthError('Enter your email and password.'); return; }

  setAuthLoading(true, 'signup');
  try {
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) { setAuthError(mapAuthError(error)); return; }
    if (data && data.session) {
      // Email confirmation is off for this project — signUp already
      // returned a live session, so log the user straight in
      bootApp();
    } else if (data && data.user) {
      setAuthMessage('Check your email to confirm your account.');
    }
  } catch (err) {
    setAuthError('Connection failed — check your internet connection and try again');
  } finally {
    setAuthLoading(false);
  }
}

document.getElementById('btnSignIn').addEventListener('click', handleSignIn);
document.getElementById('btnSignUp').addEventListener('click', handleSignUp);
document.getElementById('authPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSignIn();
});

const btnGoogleSignIn = document.getElementById('btnGoogleSignIn');
const googleBtnOriginalHTML = btnGoogleSignIn.innerHTML; // restored if the redirect never happens (error)
btnGoogleSignIn.addEventListener('click', async () => {
  setAuthError('');
  setAuthMessage('');
  btnGoogleSignIn.disabled = true;
  btnGoogleSignIn.textContent = 'Redirecting…';

  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: {
      // Dynamic, never hardcoded — works on GitHub Pages (with its
      // /reponame/ subpath) and local dev alike, derived from the page itself.
      redirectTo: window.location.origin + window.location.pathname,
      // Without this, Google silently reuses the browser's last Google
      // session and skips the account picker entirely — so switching
      // accounts (or signing out and back in as someone else) would sign
      // this app back in as whichever Google account was used last, not
      // whichever one the user actually meant to pick.
      queryParams: { prompt: 'select_account' }
    }
  });

  if (error) {
    setAuthError('Google sign-in failed: ' + error.message);
    btnGoogleSignIn.disabled = false;
    btnGoogleSignIn.innerHTML = googleBtnOriginalHTML;
  }
  // On success the browser navigates away to Google and back — the existing
  // onAuthStateChange listener (SIGNED_IN) picks up from there via bootApp()
});

async function handleSignOut() {
  if (realtimeChannel) {
    supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  // Clear in-memory state immediately, rather than waiting on the
  // onAuthStateChange round trip below — that listener does this same
  // cleanup too (see its own comment), but only reliably covers the
  // "session expired/signed out elsewhere" case; an explicit sign-out click
  // here shouldn't have to wait on it to feel instant.
  notes = [];
  folders = [];
  activeId = null;
  activeFolderId = null;
  currentUser = null;

  // This app's own cached state. Supabase's 'sb-*' keys are cleared by
  // signOut() itself below, not here — a queued create/delete left behind
  // for this account would otherwise flush against whichever account signs
  // in next on this device.
  localStorage.removeItem('inkpad_notes');
  localStorage.removeItem('welovenote_folders');
  localStorage.removeItem('welovenote_pending_deletes');
  localStorage.removeItem('welovenote_pending_creates');

  // scope: 'global' signs this session out everywhere (every tab/device),
  // not just this tab — an explicit "sign out" here shouldn't leave a
  // session alive elsewhere that a next sign-in could somehow inherit.
  const { error } = await supabaseClient.auth.signOut({ scope: 'global' });
  if (error) console.error('Sign out error:', error);

  // Defense in depth: signOut() is expected to have cleared its own 'sb-*'
  // keys by now — this only steps in if that somehow didn't happen, so a
  // stale session can't silently carry over into the next sign-in attempt.
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    console.error('Session still exists after signOut! Forcing local session removal');
    Object.keys(localStorage)
      .filter(k => k.startsWith('sb-'))
      .forEach(k => localStorage.removeItem(k));
  }

  showAuthScreen();
  // onAuthStateChange below still runs too and repeats some of this — see
  // its own comment for why that's necessary, not just redundant.
}

document.getElementById('btnSignOut').addEventListener('click', handleSignOut);

supabaseClient.auth.onAuthStateChange((event, session) => {
  // Kept in sync on every auth event (including the INITIAL_SESSION one
  // fired as soon as this listener is registered) — see currentUser's own
  // comment above for why this replaced calling getUser() fresh on every
  // cloud operation.
  currentUser = session?.user ?? null;
  if (event === 'SIGNED_OUT') {
    // Redundant with the click handler above for a manual sign-out, but this
    // is the only cleanup that runs for a session expiring on its own
    if (realtimeChannel) {
      supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
    document.getElementById('syncDot').className = '';
    document.getElementById('userEmail').textContent = '';
    document.getElementById('btnRefresh').style.display = 'none';
    localStorage.removeItem('inkpad_notes');
    localStorage.removeItem('welovenote_folders');
    // A queued create/delete left behind for a different account signing in
    // on this same device would flush against THAT account instead — a
    // pending create in particular would silently push this user's cached
    // note content into the next signed-in account's data.
    localStorage.removeItem('welovenote_pending_deletes');
    localStorage.removeItem('welovenote_pending_creates');
    notes = [];
    folders = [];
    activeId = null;
    activeFolderId = null;
    appInitialized = false;
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
    showAuthScreen();
  } else if (event === 'SIGNED_IN') {
    bootApp();
  }
});

async function checkSession() {
  const { data } = await supabaseClient.auth.getSession();
  // Set directly from this response too (not just the listener above) so
  // currentUser is guaranteed to be populated before bootApp() -> initApp()
  // makes its first cloud call, regardless of which of the two fires first.
  currentUser = data?.session?.user ?? null;
  if (data && data.session) bootApp();
  else showAuthScreen();
}

registerSW();
checkSession();
